x-seaweed: &seaweed
  image: chrislusf/seaweedfs:4.48
  restart: unless-stopped
  networks: [seaweed]

services:

  master:
    <<: *seaweed
    command: master -ip=master -ip.bind=0.0.0.0 -mdir=/data -volumeSizeLimitMB=1024 -defaultReplication=000
    volumes:
      - master-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  volume:
    <<: *seaweed
    command: volume -ip=volume -ip.bind=0.0.0.0 -mserver=master:9333 -dir=/data -max=0
    volumes:
      - volume-data:/data
    depends_on:
      master:
        condition: service_healthy

  filer:
    <<: *seaweed
    command: filer -ip=filer -ip.bind=0.0.0.0 -master=master:9333 -defaultStoreDir=/data
    volumes:
      - filer-data:/data
    depends_on:
      - master
      - volume

  s3:
    <<: *seaweed
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"s3-admin",
          "credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],
          "actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed s3 -filer=filer:8888 -port=8333 -config=/tmp/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set in .env}
    ports:
      - "127.0.0.1:8333:8333"
  admin:
    <<: *seaweed
    command: admin -master=master:9333 -port=23646 -dataDir=/data -adminUser=${ADMIN_USER:-admin} -adminPassword=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:23646:23646"
    volumes:
      - admin-data:/data
    depends_on:
      - master
      - filer

networks:
  seaweed:

volumes:
  master-data:
  volume-data:
  filer-data:
  admin-data:
